[package]
name = "bevy_asky"
description = "A simple question-and-answer UI middleware for Bevy"
version = "0.3.0"
edition = "2021"
authors = ["Shane Celis <shane.celis@gmail.com>"]
keywords = [
    "bevy",
    "gamedev",
]
categories = [
    "game-development"
]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shanecelis/bevy_asky"

[dependencies]
accesskit = "0.21"
bevy = { version = "0.17", default-features = false, features = [ "bevy_text", "bevy_ui", "default_font", "std", "async_executor", "bevy_log", "bevy_input_focus" ] }
bevy-alt-ui-navigation-lite = { version = "0.5.0", optional = true }
bevy_a11y = "0.17.0"
bevy_defer = { version = "0.15", optional = true }
futures = { version = "0.3.30", optional = true }
thiserror = "2.0"

[features]
default = [ "color" ]
async = [ "dep:bevy_defer", "dep:futures" ]
focus = [ "dep:bevy-alt-ui-navigation-lite" ]
button = []
color = []
ascii = []

[dev-dependencies]
bevy = "0.17"
bevy-inspector-egui = "0.35"

[[example]]
name = "text-async"
path = "examples/text_async.rs"
required-features = ["async"]

[[example]]
name = "checkbox-group-async"
path = "examples/async/checkbox_group.rs"
required-features = ["async"]

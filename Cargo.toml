[package]
name = "bevy_asky"
description = "A simple question-and-answer UI middleware for Bevy"
version = "0.7.0"
edition = "2024"
authors = ["Shane Celis <shane.celis@gmail.com>"]
keywords = [
    "bevy",
    "gamedev",
]
categories = [
    "game-development"
]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shanecelis/bevy_asky"

[dependencies]
accesskit = "0.24.1"
bevy = { version = "0.20.0", default-features = false, features = [ "bevy_text", "bevy_ui", "bevy_ui_widgets", "default_font", "std", "async_executor", "bevy_log", "bevy_input_focus", "keyboard", "mouse" ] }
bevy_a11y = "0.20.0"
bevy_defer = { path = "../bevy_defer", optional = true }
futures = { version = "0.3.30", optional = true }
thiserror = "2.0"

[features]
default = [ "color" ]
async = [ "dep:bevy_defer", "dep:futures" ]
button = []
color = []
ascii = []

[dev-dependencies]
bevy = "0.20.0"
bevy-inspector-egui = "0.37"
version-sync = "0.9.5"

[[example]]
name = "text-async"
path = "examples/async/text.rs"
required-features = ["async"]

[[example]]
name = "checkbox-group-async"
path = "examples/async/checkbox-group.rs"
required-features = ["async"]

[patch.crates-io]
bevy_egui = { git = "https://github.com/taboky-dev/bevy_egui.git", rev = "3cd933b" }
bevy-inspector-egui = { git = "https://github.com/taboky-dev/bevy-inspector-egui.git", rev = "bd1788b" }
